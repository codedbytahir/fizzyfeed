  </defs>
  <rect transform="translate(168,258) rotate(-11)" x="-120" y="-160" width="240" height="320" rx="54" fill="url(#dl-left)"/>
  <rect transform="translate(344,258) rotate(11)" x="-120" y="-160" width="240" height="320" rx="54" fill="url(#dl-right)"/>
  <rect x="136" y="98" width="240" height="320" rx="54" fill="url(#dl-center)"/>
  <path d="M 198 304 L 240 264 L 264 288 L 304 242" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="304" cy="242" r="14" fill="#FFFFFF"/>
