<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="The Deck mark — three fanned gradient cards with a white yearline spark on the front card">
  <title>The Deck mark — gradient</title>
  <defs>
    <linearGradient id="dl-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D5FF"/>
      <stop offset="1" stop-color="#0A5CFF"/>
    </linearGradient>
    <linearGradient id="dl-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6333FF"/>
      <stop offset="1" stop-color="#0A5CFF"/>
