<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="favicon — three fanned cards, no spark">
  <title>The Deck favicon</title>
  <defs>
    <linearGradient id="df-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D5FF"/>
      <stop offset="1" stop-color="#0A5CFF"/>
    </linearGradient>
    <linearGradient id="df-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6333FF"/>
      <stop offset="1" stop-color="#0A5CFF"/>
    </linearGradient>
    <linearGradient id="df-center" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6333FF"/>
      <stop offset="0.45" stop-color="#0A5CFF"/>
      <stop offset="1" stop-color="#00D5FF"/>
    </linearGradient>
  </defs>
  <rect transform="translate(168,258) rotate(-11)" x="-120" y="-160" width="240" height="320" rx="54" fill="url(#df-left)"/>
  <rect transform="translate(344,258) rotate(11)" x="-120" y="-160" width="240" height="320" rx="54" fill="url(#df-right)"/>
  <rect x="136" y="98" width="240" height="320" rx="54" fill="url(#df-center)"/>
</svg>
