<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx · yearline-draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* == page scaffold (standalone preview only — landing strips this block) == */
  html,body{margin:0;background:#05070E}
  body{min-height:100vh;display:grid;place-items:center;padding:24px}

  /* == fx-yearline-draw module styles — all selectors scoped under .fx-yearline-draw == */
  .fx-yearline-draw{
    /* design tokens §1 */
    --electric-500:#0A5CFF; --electric-600:#0047E0; --volt-500:#00D5FF;
    --spark-500:#C8FF4D; --ink-950:#05070E; --ink-900:#0A0E1A; --ink-800:#131A2B;
    --ink-300:#9AA8C4; --ink-200:#C6D0E4; --ink-50:#F5F8FE; --white:#FFFFFF;

    position:relative; overflow:hidden; box-sizing:border-box;
    width:100%; max-width:1200px;
    padding:30px 56px 24px;
    background:
      radial-gradient(720px 320px at 88% -20%, rgb(10 92 255 / .12), transparent 62%),
      var(--ink-950);
    color:var(--ink-200);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
  }
  .fx-yearline-draw,.fx-yearline-draw *{box-sizing:border-box}

  .fx-yearline-draw__frame{position:relative;z-index:1}
  .fx-yearline-draw__head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .fx-yearline-draw__sparkdot{width:7px;height:7px;border-radius:50%;background:var(--spark-500);box-shadow:0 0 10px rgb(200 255 77 / .4)}
  .fx-yearline-draw__tagline{
    font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;
    letter-spacing:.01em;color:var(--ink-200);
  }

  .fx-yearline-draw__anim{transition:opacity .45s ease}
  .fx-yearline-draw.is-out .fx-yearline-draw__anim{opacity:0;transition-duration:1.15s}

  .fx-yearline-draw__stats{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-bottom:22px}
  .fx-yearline-draw__stat{min-width:0}
  .fx-yearline-draw__value{
    font-family:'JetBrains Mono',monospace;font-weight:500;
    font-size:40px;line-height:1;color:var(--ink-50);
    font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
  }
  .fx-yearline-draw__label{
    margin-top:9px;font-size:13px;line-height:1;font-weight:400;
    letter-spacing:.02em;color:var(--ink-300);
  }

  .fx-yearline-draw__chart{display:block;width:100%;height:auto}
  .fx-yearline-draw__gridline{stroke:var(--ink-800);stroke-width:1;opacity:.55}
  .fx-yearline-draw__gridline--v{opacity:.32}
  .fx-yearline-draw__gridline--axis{opacity:.9}

  .fx-yearline-draw__line{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .fx-yearline-draw__line--halo{stroke:var(--electric-500);stroke-width:12;opacity:.13}
  .fx-yearline-draw__line--glow{stroke:var(--electric-500);stroke-width:6;opacity:.34}
  .fx-yearline-draw__line--core{stroke:var(--white);stroke-width:2.5}

  .fx-yearline-draw__mdot{
    fill:var(--white);stroke:var(--electric-500);stroke-width:2;
    transform-box:fill-box;transform-origin:center;
  }
  .fx-yearline-draw__mlabel{
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:11.5px;
    fill:var(--ink-300);text-anchor:middle;
    transform-box:fill-box;transform-origin:50% 100%;
  }

  /* live mode: markers stay hidden until the line passes them */
  .fx-yearline-draw.is-live .fx-yearline-draw__mdot{opacity:0;transform:scale(0)}
  .fx-yearline-draw.is-live .fx-yearline-draw__mdot.is-on{animation:fx4-pop .48s cubic-bezier(.3,1.6,.45,1) both}
  .fx-yearline-draw.is-live .fx-yearline-draw__mlabel{opacity:0;transform:scale(.4)}
  .fx-yearline-draw.is-live .fx-yearline-draw__mlabel.is-on{animation:fx4-poplabel .5s cubic-bezier(.3,1.6,.45,1) both}

  @keyframes fx4-pop{
    0%{opacity:0;transform:scale(0)}
    60%{opacity:1;transform:scale(1.45)}
    100%{opacity:1;transform:scale(1)}
  }
  @keyframes fx4-poplabel{
    0%{opacity:0;transform:scale(.4)}
    60%{opacity:1;transform:scale(1.18)}
    100%{opacity:1;transform:scale(1)}
  }

  .fx-yearline-draw__spark-halo{fill:var(--electric-500);opacity:.55;transform-box:fill-box;transform-origin:center}
  .fx-yearline-draw__spark-core{fill:var(--white);transform-box:fill-box;transform-origin:center}
  .fx-yearline-draw__spark.is-landed .fx-yearline-draw__spark-core{animation:fx4-land .2s ease-out both}
  .fx-yearline-draw__spark.is-landed .fx-yearline-draw__spark-halo{animation:fx4-landhalo .2s ease-out both}
  @keyframes fx4-land{0%{transform:scale(1)}45%{transform:scale(1.7)}100%{transform:scale(1)}}
  @keyframes fx4-landhalo{
    0%{transform:scale(1);opacity:.55}
    45%{transform:scale(2.5);opacity:.9}
    100%{transform:scale(1);opacity:.55}
  }

  .fx-yearline-draw__tint{opacity:0;transform-box:fill-box;transform-origin:center}
  .fx-yearline-draw__tint.is-pulse{animation:fx4-tint 1.05s ease-out both}
  @keyframes fx4-tint{
    0%{opacity:0;transform:scale(.6)}
    30%{opacity:.2}
    100%{opacity:0;transform:scale(1.3)}
  }

  @media (max-width:720px){
    .fx-yearline-draw{padding:22px 20px 16px}
    .fx-yearline-draw__stats{grid-template-columns:repeat(2,1fr);gap:18px 16px;margin-bottom:14px}
    .fx-yearline-draw__value{font-size:32px}
    .fx-yearline-draw__head{margin-bottom:12px}
  }

  @media (prefers-reduced-motion: reduce){
    .fx-yearline-draw,.fx-yearline-draw *{animation:none!important;transition:none!important}
  }
</style>
</head>

<script type="module">
/* fx-04 yearline-draw — module script, no globals, no network except the torph import below. */
const CYCLE = 16000;    // full loop
const DRAW = 10800;     // left→right draw window (ease-out)
const OUT_AT = 13200;   // dissolve begins (≈2s hold after the dot lands)
const PREP_AT = 14500;  // swap curve variant + reset while fully faded
const N = 365, W = 1088, PADL = 10, PADR = 12, YBASE = 190, YH = 176;
const FINALS = [5214, 389102, 141, 12];
const CH_STEPS = [1, 1, 2, 3, 4, 4, 5, 6, 7, 8, 9, 11]; // channels discovered per month; 12 lands with the dot
const VARIANTS = [
  { seed: 20240117, overrides: [] },
  { seed: 733114, overrides: [[7, 0.26], [12, 0.9], [4, 0.66]] },
  { seed: 990552, overrides: [[4, 0.68], [7, 0.34], [13, 0.62], [14, 0.68], [11, 0.76]] },
];

/* ---- curve synthesis (deterministic, pre-seeded) ---- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const BASE_ANCHORS = [
  [0.0, 0.14], [0.055, 0.2], [0.115, 0.24], [0.2, 0.44], [0.29, 0.62],
  [0.345, 0.55], [0.42, 0.48], [0.5, 0.3], [0.555, 0.36], [0.63, 0.52],
  [0.7, 0.66], [0.775, 0.8], [0.845, 0.86], [0.9, 0.66], [0.945, 0.72], [1.0, 1.0],
];
function catmullY(anchors, x) {
  const n = anchors.length;
  let k = 0;
  while (k < n - 2 && x > anchors[k + 1][0]) k++;
  const p1 = anchors[k], p2 = anchors[k + 1];
  const p0 = anchors[Math.max(0, k - 1)], p3 = anchors[Math.min(n - 1, k + 2)];
  const t = (x - p1[0]) / (p2[0] - p1[0]), t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t
    + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2
    + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
}
function makeCurve(seed, overrides) {
  const anchors = BASE_ANCHORS.map(a => a.slice());
  for (const [i, v] of overrides || []) anchors[i][1] = v;
  const rng = mulberry32(seed);
  let noise = Array.from({ length: N }, () => rng() * 2 - 1);
  for (let pass = 0; pass < 3; pass++) {
    const s = noise.slice();
    for (let i = 0; i < N; i++) {
      const l = s[Math.max(0, i - 1)], r = s[Math.min(N - 1, i + 1)];
      noise[i] = 0.25 * l + 0.5 * s[i] + 0.25 * r;
    }
  }
  const bursts = new Map();
  const count = 10 + Math.floor(rng() * 5);
  for (let b = 0; b < count; b++) {
    const idx = 2 + Math.floor(rng() * (N - 4));
    bursts.set(idx, (bursts.get(idx) || 0) + 0.05 + rng() * 0.13);
  }
  const v = new Array(N);
  for (let i = 0; i < N; i++) {
    const val = catmullY(anchors, i / (N - 1)) + noise[i] * 0.05 + (bursts.get(i) || 0);
    v[i] = Math.min(1, Math.max(0.02, val));
  }
  v[0] = anchors[0][1];
  v[N - 1] = 1;
  return v;
}
const xOf = i => PADL + (i / (N - 1)) * (W - PADL - PADR);
const yOf = v => YBASE - v * YH;
function pathD(v) {
  let d = '';
  for (let i = 0; i < N; i++) d += (i ? 'L' : 'M') + xOf(i).toFixed(1) + ' ' + yOf(v[i]).toFixed(1);
  return d;
}
function cumArea(v) {
  const c = new Array(N); c[0] = 0;
  for (let i = 1; i < N; i++) c[i] = c[i - 1] + (v[i - 1] + v[i]) / 2;
  return c;
}

/* ---- torph loader: dynamic import in try/catch, never blocks or breaks the loop ----
   (esm.sh/torph exports the vanilla class as TextMorph; inspected at runtime with
   fallbacks for other shapes. If it fails or times out we simply keep the rAF count-up.) */
let TextMorphCtor = null, torphSettled = false, torphStarted = false;
const loadTorph = () => {
  if (torphStarted) return;
  torphStarted = true;
  try {
    Promise.race([
      import('https://esm.sh/torph'),
      new Promise(res => setTimeout(() => res(null), 2500)),
    ]).then(m => {
      TextMorphCtor = (m && (m.TextMorph || m.textMorph
        || (m.default && (m.default.TextMorph || m.default.textMorph)))) || null;
      torphSettled = true;
    }).catch(() => { torphSettled = true; });
  } catch (e) { torphSettled = true; }
};

const fmt = n => n.toLocaleString('en-US');
const easeOutCubic = u => 1 - Math.pow(1 - u, 3);

function initModule(root) {
  if (root.dataset.fxReady) return;
  root.dataset.fxReady = '1';

  const qa = s => Array.from(root.querySelectorAll(s));
  const paths = qa('.fx-yearline-draw__line');
  const mdots = qa('.fx-yearline-draw__mdot');
  const mlabels = qa('.fx-yearline-draw__mlabel');
  const spark = root.querySelector('.fx-yearline-draw__spark');
  const tint = root.querySelector('.fx-yearline-draw__tint');
  const values = qa('.fx-yearline-draw__value');

  const reduced = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return; /* static composed frame already present in the markup */
  loadTorph();

  const variants = VARIANTS.map(({ seed, overrides }) => {
    const v = makeCurve(seed, overrides);
    const cum = cumArea(v);
    return { v, d: pathD(v), cum, total: cum[N - 1] };
  });
  let vIdx = 0, pathLen = 0;

  const applyVariant = i => {
    const vd = variants[i];
    for (const p of paths) {
      p.setAttribute('d', vd.d);
      const L = p.getTotalLength();
      p.style.strokeDasharray = L + ' ' + L;
      p.style.strokeDashoffset = L;
    }
    pathLen = paths[0].getTotalLength();
    for (let m = 0; m < 12; m++) {
      const idx = Math.round(((m + 0.5) / 12) * (N - 1));
      mdots[m].setAttribute('cx', xOf(idx).toFixed(1));
      mdots[m].setAttribute('cy', yOf(vd.v[idx]).toFixed(1));
    }
  };

  let start = 0, rafId = 0, running = false, pauseAt = 0, hiddenAt = 0;
  let lastCyc = -1, popped = 0, landed = false, outSet = false, didPrepare = false;
  let lastCounterAt = -1e9, lastShown = [-1, -1, -1, -1];
  let morphers = null, torphChecked = false;

  const tryAttachTorph = () => {
    if (morphers || !TextMorphCtor) return;
    try {
      morphers = values.map((el, i) => {
        el.textContent = ''; /* TextMorph owns the element's content from here on */
        const m = new TextMorphCtor({
          element: el, locale: 'en', duration: 420,
          ease: 'cubic-bezier(0.22, 1, 0.36, 1)',
        });
        m.update(lastShown[i] >= 0 ? lastShown[i] : 0);
        return m;
      });
    } catch (e) { morphers = null; }
  };

  const areaAt = (p, vd) => {
    const f = p * (N - 1), i = Math.min(N - 2, Math.floor(f)), fr = f - i;
    return (vd.cum[i] + (vd.cum[i + 1] - vd.cum[i]) * fr) / vd.total;
  };
  const runningValues = (p, vd) => {
    const a = areaAt(p, vd);
    return [
      Math.round(FINALS[0] * a),
      Math.round(FINALS[1] * Math.pow(a, 0.94)),
      Math.round(FINALS[2] * Math.pow(p, 1.28)),
      morphers ? CH_STEPS[Math.min(11, Math.floor(p * 12))]
               : (p <= 0 ? 0 : Math.min(12, Math.max(1, Math.round(p * 13.2)))),
    ];
  };
  const setCounters = (vals, force) => {
    for (let i = 0; i < 4; i++) {
      const val = vals[i];
      if (!force && val === lastShown[i]) continue;
      lastShown[i] = val;
      if (morphers) {
        try { morphers[i].update(val); }
        catch (e) { values[i].textContent = fmt(val); }
      } else {
        values[i].textContent = fmt(val);
      }
    }
  };

  const resetCycleBits = () => {
    popped = 0;
    for (const d of mdots) d.classList.remove('is-on');
    for (const l of mlabels) l.classList.remove('is-on');
    spark.classList.remove('is-landed');
    tint.classList.remove('is-pulse');
    lastShown = [-1, -1, -1, -1];
  };
  const toStartState = () => {
    applyVariant(vIdx);
    for (let i = 0; i < 4; i++) {
      if (morphers) {
        try { morphers[i].update(0); continue; } catch (e) { /* fall back below */ }
      }
      values[i].textContent = '0';
    }
    resetCycleBits();
  };

  const popThrough = m => {
    while (popped < m) {
      const k = popped++;
      mdots[k].classList.add('is-on');
      mlabels[k].classList.add('is-on');
    }
  };

  const frame = now => {
    rafId = 0;
    if (!torphChecked && torphSettled) { torphChecked = true; tryAttachTorph(); }
    const el = now - start;
    const cyc = Math.floor(el / CYCLE);
    const t = el - cyc * CYCLE;
    if (cyc !== lastCyc) {
      lastCyc = cyc;
      root.classList.remove('is-out'); /* fade the band back in as the new year starts */
      spark.classList.remove('is-landed'); /* re-arm the overshoot pop for this cycle */
      tint.classList.remove('is-pulse');
      if (!didPrepare) { vIdx = (vIdx + 1) % variants.length; toStartState(); } /* glitch recovery */
      didPrepare = false;
      landed = false;
      outSet = false;
    }
    const vd = variants[vIdx];
    if (t < DRAW) {
      const p = easeOutCubic(t / DRAW);
      const off = String(pathLen * (1 - p));
      for (const path of paths) path.style.strokeDashoffset = off;
      const i = Math.min(N - 1, Math.round(p * (N - 1)));
      spark.setAttribute('transform',
        'translate(' + xOf(i).toFixed(1) + ' ' + yOf(vd.v[i]).toFixed(1) + ')');
      popThrough(Math.min(12, Math.floor(p * 12)));
      const cadence = morphers ? 300 : 0;
      if (now - lastCounterAt >= cadence) {
        lastCounterAt = now;
        setCounters(runningValues(p, vd), false);
      }
    } else if (!landed) {
      landed = true;
      for (const path of paths) path.style.strokeDashoffset = '0';
      spark.setAttribute('transform', 'translate(' + xOf(N - 1).toFixed(1) + ' ' + yOf(1).toFixed(1) + ')');
      popThrough(12);
      setCounters(FINALS.slice(), true);
      spark.classList.add('is-landed');
      tint.classList.add('is-pulse');
    }
    if (landed) {
      if (t >= OUT_AT && !outSet) { outSet = true; root.classList.add('is-out'); }
      if (t >= PREP_AT && !didPrepare) {
        didPrepare = true;
        vIdx = (vIdx + 1) % variants.length;
        toStartState(); /* swap curve + zero counters while the band is invisible */
      }
    }
    if (running) rafId = requestAnimationFrame(frame);
  };

  const setActive = on => {
    if (on && !running) {
      running = true;
      if (pauseAt) { start += performance.now() - pauseAt; pauseAt = 0; }
      else if (!start) start = performance.now();
      if (!rafId) rafId = requestAnimationFrame(frame);
    } else if (!on && running) {
      running = false;
      pauseAt = performance.now();
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    }
  };

  let ioVisible = true;
  const effective = () => ioVisible
    && root.getAttribute('data-fx-state') !== 'idle'
    && !document.hidden;
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => {
      ioVisible = es[es.length - 1].isIntersecting;
      setActive(effective());
    }, { threshold: 0.12 });
    io.observe(root);
  }
  if ('MutationObserver' in window) {
    new MutationObserver(() => setActive(effective()))
      .observe(root, { attributes: true, attributeFilter: ['data-fx-state'] });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = performance.now();
    else if (hiddenAt) {
      if (running) start += performance.now() - hiddenAt;
      hiddenAt = 0;
    }
    setActive(effective());
  });

  /* boot: markup ships the composed final frame; live mode resets and draws */
  root.classList.add('is-live', 'is-out');
  toStartState();
  didPrepare = true; /* the first cycle starts from the boot reset, not the wrap handler */
  setActive(true);
}

document.querySelectorAll('.fx-yearline-draw').forEach(initModule);
</script>
</body>
</html>
