<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx · queue-recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* == page scaffold (standalone preview only — landing strips this block) == */
  html,body{margin:0;background:#05070E}
  body{display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}

  /* == fx-06 queue-recap module styles — ALL selectors scoped under .fx-queue-recap == */
  .fx.fx-queue-recap{
    /* §1 design tokens (inlined) */
    --electric-500:#0A5CFF; --electric-600:#0047E0; --volt-500:#00D5FF; --violet-500:#6333FF;
    --spark-500:#C8FF4D; --ink-950:#05070E; --ink-900:#0A0E1A; --ink-800:#131A2B;
    --ink-300:#9AA8C4; --ink-200:#C6D0E4; --ink-50:#F5F8FE; --white:#FFFFFF;
    --grad-brand:linear-gradient(135deg,#6333FF,#0A5CFF,#00D5FF);
    --radius-card:28px; --radius-md:14px; --radius-pill:999px;
    --shadow-card:0 8px 30px rgb(5 7 14 / .35);
    --glow-electric:0 0 0 1px rgb(10 92 255 / .25), 0 12px 48px rgb(10 92 255 / .35);

    position:relative; width:100%; max-width:1200px; aspect-ratio:16/9;
    background:var(--ink-950); overflow:hidden; user-select:none;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
  }
  .fx-queue-recap__stage{
    position:absolute; left:50%; top:50%; width:1200px; height:675px;
    transform:translate(-50%,-50%) scale(var(--fx-qr-scale,1));
    transform-origin:center;
  }

  /* ambient light — the two radial glows (OG-kit language), breathing opacity only */
  .fx-queue-recap__glow{position:absolute; border-radius:50%; pointer-events:none}
  .fx-queue-recap__glow--a{left:420px; top:-140px; width:560px; height:560px;
    background:radial-gradient(closest-side, rgb(10 92 255/.16), rgb(10 92 255/0));
    animation:fx-qr-glow 7.5s ease-in-out infinite alternate}
  .fx-queue-recap__glow--b{left:-80px; top:320px; width:520px; height:520px;
    background:radial-gradient(closest-side, rgb(99 51 255/.13), rgb(99 51 255/0));
    animation:fx-qr-glow 7.5s ease-in-out infinite alternate-reverse}
  @keyframes fx-qr-glow{from{opacity:.55}to{opacity:1}}

  /* ---- recap card ---- */
  .fx-queue-recap__card{
    position:absolute; left:390px; top:148px; width:420px; height:280px;
    background:var(--white); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); will-change:transform,opacity;
    -webkit-font-smoothing:antialiased;
  }
  .fx-queue-recap__content{
    display:flex; flex-direction:column; justify-content:center;
    height:100%; padding:0 36px; will-change:transform,opacity;
  }
  .fx-queue-recap__meta{
    display:flex; align-items:center; gap:8px; height:18px; will-change:transform,opacity;
  }
  .fx-queue-recap__meta-dot{
    width:6px; height:6px; border-radius:50%; background:var(--electric-500); opacity:.4; flex:none;
  }
  .fx.fx-queue-recap.is-composing .fx-queue-recap__meta-dot{
    animation:fx-qr-dot 1.6s ease-in-out infinite;
  }
  @keyframes fx-qr-dot{0%,100%{opacity:.35; transform:scale(1)} 50%{opacity:1; transform:scale(1.3)}}
  .fx-queue-recap__meta-label{
    font:500 11px/1 'Inter',system-ui,sans-serif; letter-spacing:.06em;
    color:#5A6B8C; /* solid, 5.4:1 on white — was #33405C at opacity .72 ≈ 2.9:1 */
  }
  .fx-queue-recap__meta-tag{
    margin-left:auto; font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;
    letter-spacing:.05em; color:#33405C; background:var(--ink-50);
    border:1px solid rgb(5 7 14/.06); border-radius:var(--radius-pill); padding:4px 9px 3px;
  }
  .fx-queue-recap__line{margin:0; white-space:nowrap}
  .fx-queue-recap__line--head{
    margin-top:24px; min-height:30px;
    font:700 24px/1.25 'Space Grotesk','Inter',system-ui,sans-serif;
    letter-spacing:-.01em; color:var(--ink-950);
  }
  .fx-queue-recap__rule{height:1px; background:rgb(5 7 14/.08); margin-top:22px; flex:none}
  .fx-queue-recap__line--stats,.fx-queue-recap__line--body{
    margin-top:20px; min-height:21px;
    font:400 14px/1.5 'Inter',system-ui,sans-serif; color:#33405C;
  }
  .fx-queue-recap__line--body{margin-top:10px}
  .fx-queue-recap__type{
    display:inline-block; position:relative; white-space:pre;
  }
  /* thin caret — opacity/transform only */
  .fx-queue-recap__caret{
    display:inline-block; width:2px; border-radius:1px; margin-left:2px;
    background:var(--electric-500); opacity:0;
  }
  .fx-queue-recap__caret--head{height:22px; vertical-align:-3px}
  .fx-queue-recap__caret--stats,.fx-queue-recap__caret--body{height:15px; vertical-align:-2px}
  .fx-queue-recap__caret.is-on{animation:fx-qr-caret 1.06s linear infinite}
  @keyframes fx-qr-caret{0%,49%{opacity:1} 50%,100%{opacity:0}}

  /* ---- mini channel chips (fan arc above the card) ---- */
  .fx-queue-recap__chip{position:absolute; width:52px; height:52px}
  .fx-queue-recap__chip:nth-of-type(1){left:339px; top:152px; --tilt:-18deg; --dot:#6333FF}
  .fx-queue-recap__chip:nth-of-type(2){left:424px; top:129px; --tilt:-12deg; --dot:#FF8A00}
  .fx-queue-recap__chip:nth-of-type(3){left:512px; top:115px; --tilt:-6deg;  --dot:#0A5CFF}
  .fx-queue-recap__chip:nth-of-type(4){left:600px; top:110px; --tilt:0deg;   --dot:#0047E0}
  .fx-queue-recap__chip:nth-of-type(5){left:688px; top:115px; --tilt:6deg;   --dot:#C8FF4D}
  .fx-queue-recap__chip:nth-of-type(6){left:776px; top:129px; --tilt:12deg;  --dot:#FF5C5C}
  .fx-queue-recap__chip:nth-of-type(7){left:861px; top:152px; --tilt:18deg;  --dot:#00D5FF}
  .fx-queue-recap__chip-in{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:var(--ink-800); border:1px solid rgb(255 255 255/.06); border-radius:var(--radius-md);
    box-shadow:inset 0 1px 0 rgb(255 255 255/.07), 0 10px 24px rgb(5 7 14/.5);
    opacity:0; transform:rotate(var(--tilt,0deg)); will-change:transform,opacity;
  }
  .fx-queue-recap__chip-glyph{
    font:600 15px/1 'Inter',system-ui,sans-serif; color:var(--white); letter-spacing:.01em;
  }
  .fx-queue-recap__chip:nth-of-type(1) .fx-queue-recap__chip-glyph{font-size:16px}
  .fx-queue-recap__chip:nth-of-type(2) .fx-queue-recap__chip-glyph{font-size:12.5px}
  .fx-queue-recap__chip:nth-of-type(3) .fx-queue-recap__chip-glyph{font-size:13.5px}
  .fx-queue-recap__chip:nth-of-type(4) .fx-queue-recap__chip-glyph{font-size:15px}
  .fx-queue-recap__chip:nth-of-type(5) .fx-queue-recap__chip-glyph{font-size:16.5px}
  .fx-queue-recap__chip:nth-of-type(6) .fx-queue-recap__chip-glyph{font-size:11px}
  .fx-queue-recap__chip:nth-of-type(7) .fx-queue-recap__chip-glyph{font-size:12px}
  .fx-queue-recap__chip-dot{
    position:absolute; right:7px; top:7px; width:6px; height:6px; border-radius:50%;
    background:var(--dot,var(--white)); opacity:1;
  }
  .fx-queue-recap__chip-check{
    position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px;
    opacity:0; transform:scale(.55); will-change:transform,opacity;
  }
  .fx-queue-recap__chip-check path{
    fill:none; stroke:var(--volt-500); stroke-width:2.7; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1; stroke-dashoffset:1;
  }

  /* ---- primary CTA — the one place glow is allowed ---- */
  .fx-queue-recap__cta{position:absolute; left:50%; top:462px; height:50px; transform:translateX(-50%); pointer-events:none}
  .fx-queue-recap__cta-halo{
    position:absolute; inset:-46px -70px; border-radius:var(--radius-pill); opacity:0;
    background:radial-gradient(closest-side, rgb(10 92 255/.22), rgb(10 92 255/0) 74%);
    will-change:opacity; pointer-events:none;
  }
  .fx-queue-recap__cta-glowhot{
    position:absolute; inset:0; border-radius:var(--radius-pill); opacity:0; z-index:1;
    box-shadow:0 0 0 1px rgb(10 92 255/.3), 0 14px 60px rgb(10 92 255/.32), 0 4px 18px rgb(10 92 255/.22);
    will-change:opacity,transform; pointer-events:none;
  }
  .fx-queue-recap__cta-press{
    position:relative; z-index:2; display:flex; align-items:center; height:50px; padding:0 30px;
    border-radius:var(--radius-pill); background:var(--electric-600); color:rgb(255 255 255/.92);
    font:500 15px/1 'Inter',system-ui,sans-serif; letter-spacing:.01em; white-space:nowrap;
    box-shadow:0 0 0 1px rgb(10 92 255/.2), 0 8px 26px rgb(5 7 14/.45); will-change:transform;
  }
  .fx-queue-recap__cta-note{
    position:absolute; left:50%; top:532px; transform:translateX(-50%);
    font:500 12px/1 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.05em;
    color:var(--ink-300); white-space:nowrap;
  }
  @media (max-width: 720px){
    .fx-queue-recap__cta-note{display:none} /* fit() crops the stage; the real button is directly below */
  }

  /* paused by the landing page's visibility observer */
  .fx.fx-queue-recap.is-paused .fx-queue-recap__caret,
  .fx.fx-queue-recap.is-paused .fx-queue-recap__glow,
  .fx.fx-queue-recap.is-paused .fx-queue-recap__meta-dot{animation-play-state:paused}

  /* reduced motion: static composed frame, no loop, no blink, no breathe */
  @media (prefers-reduced-motion: reduce){
    .fx-queue-recap__caret{animation:none !important; opacity:0 !important}
    .fx-queue-recap__glow,.fx-queue-recap__meta-dot{animation:none !important}
  }
  .fx.fx-queue-recap.is-static .fx-queue-recap__caret{animation:none !important; opacity:0 !important}
  .fx.fx-queue-recap.is-static .fx-queue-recap__glow,
  .fx.fx-queue-recap.is-static .fx-queue-recap__meta-dot{animation:none !important}
</style>
</head>
<body>

  <!-- FX-MODULE-START -->
  <!-- MODULE ROOT: this whole div is what the landing page embeds -->
  <div class="fx fx-queue-recap" data-brand-name="fizzyfeed" data-fx-state="idle" role="img"
       aria-label="Animation: a recap post reading ‘your year in posts.’ types itself onto a white card, a ‘queue the recap’ button presses once, and the post fans out into seven channel chips that each receive a cyan checkmark.">
    <div class="fx-queue-recap__stage">
      <div class="fx-queue-recap__glow fx-queue-recap__glow--a"></div>
      <div class="fx-queue-recap__glow fx-queue-recap__glow--b"></div>

      <div class="fx-queue-recap__chips">
        <div class="fx-queue-recap__chip"><div class="fx-queue-recap__chip-in"><span class="fx-queue-recap__chip-glyph">X</span><span class="fx-queue-recap__chip-dot"></span><svg class="fx-queue-recap__chip-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.9l4 4.1 8-9.4" pathLength="1"/></svg></div></div>
        <div class="fx-queue-recap__chip"><div class="fx-queue-recap__chip-in"><span class="fx-queue-recap__chip-glyph">IG</span><span class="fx-queue-recap__chip-dot"></span><svg class="fx-queue-recap__chip-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.9l4 4.1 8-9.4" pathLength="1"/></svg></div></div>
        <div class="fx-queue-recap__chip"><div class="fx-queue-recap__chip-in"><span class="fx-queue-recap__chip-glyph">in</span><span class="fx-queue-recap__chip-dot"></span><svg class="fx-queue-recap__chip-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.9l4 4.1 8-9.4" pathLength="1"/></svg></div></div>
        <div class="fx-queue-recap__chip"><div class="fx-queue-recap__chip-in"><span class="fx-queue-recap__chip-glyph">f</span><span class="fx-queue-recap__chip-dot"></span><svg class="fx-queue-recap__chip-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.9l4 4.1 8-9.4" pathLength="1"/></svg></div></div>
        <div class="fx-queue-recap__chip"><div class="fx-queue-recap__chip-in"><span class="fx-queue-recap__chip-glyph">&#9834;&#xFE0E;</span><span class="fx-queue-recap__chip-dot"></span><svg class="fx-queue-recap__chip-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.9l4 4.1 8-9.4" pathLength="1"/></svg></div></div>
        <div class="fx-queue-recap__chip"><div class="fx-queue-recap__chip-in"><span class="fx-queue-recap__chip-glyph">&#9654;&#xFE0E;</span><span class="fx-queue-recap__chip-dot"></span><svg class="fx-queue-recap__chip-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.9l4 4.1 8-9.4" pathLength="1"/></svg></div></div>
        <div class="fx-queue-recap__chip"><div class="fx-queue-recap__chip-in"><span class="fx-queue-recap__chip-glyph">th</span><span class="fx-queue-recap__chip-dot"></span><svg class="fx-queue-recap__chip-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.9l4 4.1 8-9.4" pathLength="1"/></svg></div></div>
      </div>

      <div class="fx-queue-recap__card">
        <div class="fx-queue-recap__content">
          <div class="fx-queue-recap__meta">
            <span class="fx-queue-recap__meta-dot"></span>
            <span class="fx-queue-recap__meta-label">new post</span>
            <span class="fx-queue-recap__meta-tag">draft</span>
          </div>
          <p class="fx-queue-recap__line fx-queue-recap__line--head"><span class="fx-queue-recap__type" data-type="head">your year in posts.</span><span class="fx-queue-recap__caret fx-queue-recap__caret--head" data-caret="head"></span></p>
          <div class="fx-queue-recap__rule"></div>
          <p class="fx-queue-recap__line fx-queue-recap__line--stats"><span class="fx-queue-recap__type" data-type="stats">5,214 posts · 389,102 words · 141-day streak</span><span class="fx-queue-recap__caret fx-queue-recap__caret--stats" data-caret="stats"></span></p>
          <p class="fx-queue-recap__line fx-queue-recap__line--body"><span class="fx-queue-recap__type" data-type="body">the deck says: you never missed a friday.</span><span class="fx-queue-recap__caret fx-queue-recap__caret--body" data-caret="body"></span></p>
        </div>
      </div>

      <div class="fx-queue-recap__cta">
        <div class="fx-queue-recap__cta-halo"></div>
        <div class="fx-queue-recap__cta-glowhot"></div>
        <div class="fx-queue-recap__cta-press">queue the recap</div>
      </div>
      <div class="fx-queue-recap__cta-note" aria-hidden="true">composer preview — queue the recap below</div>
    </div>
  </div>
  <!-- FX-MODULE-END -->

  <script type="module">
    (() => {
      const root = document.querySelector('.fx-queue-recap');
      if (!root || root.dataset.qrBound) return;
      root.dataset.qrBound = '1';

      /* ---------- refs ---------- */
      const stage   = root.querySelector('.fx-queue-recap__stage');
      const card    = root.querySelector('.fx-queue-recap__card');
      const content = root.querySelector('.fx-queue-recap__content');
      const meta    = root.querySelector('.fx-queue-recap__meta');
      const press   = root.querySelector('.fx-queue-recap__cta-press');
      const glowHot = root.querySelector('.fx-queue-recap__cta-glowhot');
      const halo    = root.querySelector('.fx-queue-recap__cta-halo');

      const LINES = {
        head:  { el: root.querySelector('[data-type="head"]'),  full: 'your year in posts.',                            t0: 0.35, tick: 0.042, last: '' },
        stats: { el: root.querySelector('[data-type="stats"]'), full: '5,214 posts \u00B7 389,102 words \u00B7 141-day streak', t0: 1.75, tick: 0.030, last: '' },
        body:  { el: root.querySelector('[data-type="body"]'),  full: 'the deck says: you never missed a friday.',      t0: 3.50, tick: 0.026, last: '' }
      };
      const CARETS = {
        head:  root.querySelector('[data-caret="head"]'),
        stats: root.querySelector('[data-caret="stats"]'),
        body:  root.querySelector('[data-caret="body"]')
      };

      /* timeline beats (seconds of the 15s cycle) */
      const T = {
        head: 0.35, stats: 1.75, body: 3.50,
        press: 4.75,
        collapse: 5.55, cardOut: 5.70, emerge: 5.90,
        check: 7.00,
        pulse: 12.40,
        reset: 13.90, cardIn: 13.95, caretBack: 14.70
      };
      const CARD_CX = 600, CARD_CY = 288;      /* chips are born at the card centre */
      const EMERGE_ORD = [3, 2, 4, 1, 5, 0, 6]; /* centre-out bloom, 80ms apart */
      const RESET_ORD  = [0, 6, 1, 5, 2, 4, 3]; /* outermost back first, 40ms apart */
      const CYCLE = 15;

      /* ---------- chips: read geometry + tilt from CSS (single source of truth) ---------- */
      const chipState = Array.from(root.querySelectorAll('.fx-queue-recap__chip')).map((chip, i) => {
        const inner = chip.querySelector('.fx-queue-recap__chip-in');
        const checkSvg = chip.querySelector('.fx-queue-recap__chip-check');
        let tilt = 0;
        try { tilt = parseFloat(getComputedStyle(inner).getPropertyValue('--tilt')) || 0; } catch (e) { tilt = 0; }
        return {
          i, inner, checkSvg,
          checkPath: checkSvg ? checkSvg.querySelector('path') : null,
          dot: chip.querySelector('.fx-queue-recap__chip-dot'),
          ax: chip.offsetLeft + chip.offsetWidth / 2,
          ay: chip.offsetTop + chip.offsetHeight / 2,
          tilt,
          ord: EMERGE_ORD.indexOf(i),
          rord: RESET_ORD.indexOf(i)
        };
      });

      /* ---------- tiny easing kit ---------- */
      const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
      const easeOutQuad  = p => 1 - (1 - p) * (1 - p);
      const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
      const easeInCubic  = p => p * p * p;
      const easeInOutCubic = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      const easeOutBack = (p, k) => { const c1 = k, c3 = c1 + 1, x = p - 1; return 1 + c3 * x * x * x + c1 * x * x; };

      /* ---------- torph: dynamic import, inspect exports, fall back cleanly ---------- */
      let morphs = null;
      (async () => {
        try {
          const m = await import('https://esm.sh/torph');
          if (!m || typeof m.TextMorph !== 'function') return;
          const next = {};
          for (const key in LINES) {
            next[key] = new m.TextMorph({
              element: LINES[key].el,
              duration: 150,
              ease: 'cubic-bezier(0.33, 1, 0.68, 1)',
              numbers: true,
              locale: 'en',
              respectReducedMotion: true
            });
          }
          morphs = next;
          if (staticMode) for (const key in LINES) morphs[key].update(LINES[key].full, LINES[key].full.length);
        } catch (e) { /* torph unavailable — rAF typewriter fallback stays active */ }
      })();

      function writeText(key, s) {
        const L = LINES[key];
        if (morphs && morphs[key]) morphs[key].update(s, s.length); /* cursorIndex = caret pos */
        else L.el.textContent = s;
      }
      function typedStr(full, t, t0, tick) {
        if (t <= t0) return '';
        return full.slice(0, Math.min(full.length, Math.floor((t - t0) / tick) + 1));
      }

      /* ---------- stateful-ish toggles (class flips only, cached) ---------- */
      function setCaret(key, on) {
        const el = CARETS[key];
        if (!el || el.__on === on) return;
        el.__on = on;
        el.classList.toggle('is-on', on);
      }
      let composing = false;
      function setComposing(v) {
        if (v === composing) return;
        composing = v;
        root.classList.toggle('is-composing', v);
      }

      /* ---------- button press: down 90ms, spring back 410ms ---------- */
      function pressScale(t) {
        const u = t - T.press;
        if (u <= 0) return 1;
        if (u < 0.09) return 1 - 0.03 * easeOutQuad(u / 0.09);
        if (u < 0.5) {
          const v = (u - 0.09) / 0.41;
          return 0.97 + 0.03 * (1 - Math.exp(-5.2 * v) * Math.cos(9.5 * v));
        }
        return 1;
      }

      /* ---------- master render: pure function of cycle time t ∈ [0,15) ---------- */
      function render(t) {
        /* typewriter lines */
        for (const key in LINES) {
          const L = LINES[key];
          const s = typedStr(L.full, t, L.t0, L.tick);
          if (s !== L.last) { L.last = s; writeText(key, s); }
        }

        /* carets hop line to line, rest after press, return near cycle end */
        setCaret('head',  t < T.stats || t >= T.caretBack);
        setCaret('stats', t >= T.stats && t < T.body);
        setCaret('body',  t >= T.body && t < T.press);
        setComposing(t < T.press || t >= T.caretBack);

        /* header rises in with the reveal grammar */
        const hie = easeOutCubic(clamp01((t - 0.15) / 0.35));
        meta.style.opacity = hie.toFixed(3);
        meta.style.transform = 'translateY(' + ((1 - hie) * 8).toFixed(2) + 'px)';

        /* card content collapses up into the chips */
        const cwe = easeInCubic(clamp01((t - T.collapse) / 0.6));
        content.style.opacity = (1 - cwe).toFixed(3);
        content.style.transform = 'translateY(' + (-12 * cwe).toFixed(2) + 'px) scale(' + (1 - 0.06 * cwe).toFixed(4) + ')';

        /* card surface exits, then returns for the seamless reset */
        let co, cs;
        if (t < T.cardIn) {
          const e = easeInOutCubic(clamp01((t - T.cardOut) / 0.75));
          co = 1 - e; cs = 1 - 0.08 * e;
        } else {
          const e = easeOutCubic(clamp01((t - T.cardIn) / 0.9));
          co = e; cs = 0.92 + 0.08 * e;
        }
        card.style.opacity = co.toFixed(3);
        card.style.transform = 'scale(' + cs.toFixed(4) + ')';

        /* CTA press + the single closing glow pulse (pre-baked layers crossfaded) */
        const ps = pressScale(t);
        press.style.transform = 'scale(' + ps.toFixed(4) + ')';
        let hot = 0, hal = 0, swell = 0;
        if (t >= T.pulse) {
          const w = Math.sin(Math.PI * clamp01((t - T.pulse) / 1.4));
          hot = w; hal = w * 0.75; swell = w * 0.015;
        }
        glowHot.style.opacity = hot.toFixed(3);
        glowHot.style.transform = 'scale(' + (ps + swell).toFixed(4) + ')';
        halo.style.opacity = hal.toFixed(3);

        /* chips: emerge centre-out, breathe, then retract on the reset */
        for (const c of chipState) {
          const st = T.emerge + c.ord * 0.08;
          const rst = T.reset + c.rord * 0.04;
          let pe, op;
          if (t < rst) {
            pe = clamp01((t - st) / 0.62);
            op = clamp01(pe / 0.18);
          } else {
            const pr = clamp01((t - rst) / 0.55);
            pe = 1 - easeInOutCubic(pr);
            op = 1 - clamp01(pr / 0.7);
          }
          const e = easeOutBack(pe, 1.25);
          let br = 0;
          if (pe >= 1 && t < rst) {
            const bw = clamp01((t - st - 0.62) / 0.9) * clamp01((rst - t) / 0.4);
            br = 2.6 * Math.sin((t / 5.2) * 2 * Math.PI + c.i * 0.9) * bw;
          }
          const x = c.ax + (CARD_CX - c.ax) * (1 - e);
          const y = c.ay + (CARD_CY - c.ay) * (1 - e) + br;
          c.inner.style.opacity = op.toFixed(3);
          c.inner.style.transform =
            'translate(' + (x - c.ax).toFixed(2) + 'px,' + (y - c.ay).toFixed(2) + 'px) ' +
            'rotate(' + (c.tilt * e).toFixed(2) + 'deg) scale(' + (0.2 + 0.8 * e).toFixed(4) + ')';

          /* volt checkmark draws in, 80ms stagger, dot yields */
          const cp = clamp01((t - (T.check + c.i * 0.08)) / 0.26);
          if (c.checkPath) c.checkPath.style.strokeDashoffset = (1 - easeOutCubic(cp)).toFixed(4);
          if (c.checkSvg) {
            c.checkSvg.style.opacity = clamp01(cp * 8).toFixed(3);
            c.checkSvg.style.transform = 'scale(' + (0.55 + 0.45 * easeOutBack(cp, 1.8)).toFixed(4) + ')';
          }
          if (c.dot) c.dot.style.opacity = (1 - clamp01(cp * 1.4)).toFixed(3);
        }
      }

      /* ---------- reduced motion: final composed frame, chips all checked ---------- */
      const rmQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let staticMode = rmQuery.matches;

      function renderStatic() {
        for (const key in LINES) {
          const L = LINES[key];
          L.last = L.full;
          if (morphs && morphs[key]) morphs[key].update(L.full, L.full.length);
          else L.el.textContent = L.full;
        }
        meta.style.opacity = '1'; meta.style.transform = 'none';
        content.style.opacity = '1'; content.style.transform = 'none';
        card.style.opacity = '1'; card.style.transform = 'none';
        for (const key in CARETS) setCaret(key, false);
        setComposing(false);
        for (const c of chipState) {
          c.inner.style.opacity = '1';
          c.inner.style.transform = 'rotate(' + c.tilt + 'deg)';
          if (c.checkSvg) { c.checkSvg.style.opacity = '1'; c.checkSvg.style.transform = 'scale(1)'; }
          if (c.checkPath) c.checkPath.style.strokeDashoffset = '0';
          if (c.dot) c.dot.style.opacity = '0';
        }
        press.style.transform = 'none';
        glowHot.style.opacity = '0'; glowHot.style.transform = 'none';
        halo.style.opacity = '0';
        root.classList.add('is-static');
      }

      function onRmChange() {
        const v = rmQuery.matches;
        if (v === staticMode) return;
        staticMode = v;
        root.classList.toggle('is-static', v);
        if (v) { pauseLoop(); renderStatic(); }
        else { root.classList.remove('is-static'); resumeLoop(); }
      }
      if (typeof rmQuery.addEventListener === 'function') rmQuery.addEventListener('change', onRmChange);
      else if (typeof rmQuery.addListener === 'function') rmQuery.addListener(onRmChange);

      /* ---------- loop clock: pure t keeps every cycle seamless ---------- */
      let rafId = 0, running = false, lastT = 0, t0 = 0;
      function frame(now) {
        rafId = 0;
        if (staticMode) { running = false; return; }
        lastT = ((now - t0) % (CYCLE * 1000)) / 1000;
        render(lastT);
        rafId = requestAnimationFrame(frame);
      }
      function pauseLoop() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        running = false;
      }
      function resumeLoop() {
        if (running || staticMode) return;
        running = true;
        t0 = performance.now() - lastT * 1000;
        rafId = requestAnimationFrame(frame);
      }

      /* ---------- visibility (landing orchestrator hooks data-fx-state) ---------- */
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(entries => {
          for (const en of entries) {
            if (en.isIntersecting && !staticMode) {
              root.dataset.fxState = 'live';
              root.classList.remove('is-paused');
              resumeLoop();
            } else {
              root.dataset.fxState = 'idle';
              root.classList.add('is-paused');
              pauseLoop();
            }
          }
        }, { threshold: 0.15 });
        io.observe(root);
      } else {
        root.dataset.fxState = 'live';
        resumeLoop();
      }

      /* ---------- responsive stage: uniform scale of the fixed 1200x675 canvas ---------- */
      function fit() {
        const w = root.clientWidth || 1200;
        /* mobile: crop-scale ~1.8x fit-width; tablet band: 1.4x crop keeps the
           composer stats line >=12px at 768-1199px; side chips crop by design */
        const scale = w < 720 ? Math.min((w / 1200) * 1.8, 0.66)
                    : w < 1200 ? Math.min((w / 1200) * 1.4, 0.8)
                    : w / 1200;
        stage.style.setProperty('--fx-qr-scale', String(scale));
      }
      if ('ResizeObserver' in window) new ResizeObserver(fit).observe(root);
      else window.addEventListener('resize', fit, { passive: true });
      fit();

      /* ---------- boot: clear composed markup into frame-0, start the clock ---------- */
      for (const key in LINES) { LINES[key].el.textContent = ''; LINES[key].last = ''; }
      if (staticMode) { renderStatic(); root.dataset.fxState = 'live'; }
      else resumeLoop();
    })();
  </script>
</body>
</html>
