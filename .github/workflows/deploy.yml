name: deploy

# Auto-deploy to Cloudflare: every push to main that touches the app (or manual
# dispatch) builds the SPA and ships worker + assets in one deploy (spec 01 §1 —
# "one Worker, one deploy"). Requires repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers/D1/KV edit perms
#   CLOUDFLARE_ACCOUNT_ID  — account id
# Runs only when both secrets exist, so forks/PRs never fail on missing config.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: build + wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: install deps
        working-directory: app
        run: npm ci

      - name: verify (typecheck + tests + guardrails)
        run: |
          bash scripts/agent-check.sh
          (cd app && npm run typecheck && npm test)

      - name: build client
        working-directory: app
        run: npm run build:client

      - name: deploy worker + assets + migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: app
        run: |
          npx wrangler d1 migrations apply fizzyfeed --remote
          npx wrangler deploy

      - name: deploy skipped (secrets not configured)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set — build verified, deploy skipped. See docs/DEPLOY.md."

      - name: smoke check
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          sleep 10
          status=$(curl -s -o /dev/null -w "%{http_code}" https://fizzyfeed.<fill-your-subdomain>.workers.dev/api/health || true)
          echo "health endpoint: $status"
          [ "$status" = "200" ] || echo "::warning::health check returned $status — verify the workers.dev subdomain in docs/DEPLOY.md"
