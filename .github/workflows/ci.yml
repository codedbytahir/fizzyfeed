name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: brand guardrails + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: install app deps
        working-directory: app
        run: npm ci

      - name: brand guardrails (agent-check.sh)
        run: bash scripts/agent-check.sh

      - name: typecheck (strict, client + worker)
        working-directory: app
        run: npm run typecheck

      - name: unit tests (vitest)
        working-directory: app
        run: npm test

      - name: client build (vite)
        working-directory: app
        run: npm run build:client

      - name: worker bundle dry-run (wrangler)
        working-directory: app
        run: npx wrangler deploy --dry-run
